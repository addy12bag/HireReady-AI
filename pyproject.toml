[project]
name = "resume-ai-platform"
version = "0.1.0"
description = "Multi-Agent AI Resume Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Templates
    "jinja2>=3.1",

    # LLM
    "google-genai>=2.0",
    "groq>=0.4",

    # Document Processing
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "fpdf2>=2.8",

    # NLP
    "spacy>=3.7",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "rapidfuzz>=3.9",
    "dateparser>=1.2",

    # Scoring
    "numpy>=1.26",
    "nltk>=3.8",

    # Orchestration
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
