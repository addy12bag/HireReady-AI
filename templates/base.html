<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Resume AI{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%233b82f6'/><stop offset='50%25' stop-color='%238b5cf6'/><stop offset='100%25' stop-color='%2306b6d4'/></linearGradient></defs><rect width='100' height='100' rx='20' fill='url(%23g)'/><path d='M30 25h40a5 5 0 015 5v40a5 5 0 01-5 5H30a5 5 0 01-5-5V30a5 5 0 015-5z' fill='none' stroke='white' stroke-width='4'/><line x1='40' y1='40' x2='60' y2='40' stroke='white' stroke-width='3' stroke-linecap='round'/><line x1='40' y1='50' x2='60' y2='50' stroke='white' stroke-width='3' stroke-linecap='round'/><line x1='40' y1='60' x2='55' y2='60' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>" type="image/svg+xml">
  <script>
    // Prevent flash — apply theme before paint
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script src="/static/js/tailwind.js"></script>
  <script src="/static/js/htmx.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eff6ff', 100:'#dbeafe', 200:'#bfdbfe', 300:'#93c5fd', 400:'#60a5fa', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' },
            surface: {
              50: '#f8fafc',
              100: '#f1f5f9',
              700: '#1e293b',
              800: '#0f172a',
              900: '#0a0f1e',
              950: '#060a14',
            },
            neon: {
              cyan: '#38bdf8',
              purple: '#a78bfa',
              pink: '#f472b6',
              green: '#4ade80',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 dark:bg-surface-950 text-gray-900 dark:text-gray-100 antialiased transition-colors duration-500 font-sans" hx-boost="true">
  <div class="min-h-full flex flex-col">

    <!-- Nav -->
    <nav class="nav-glass sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <a href="/" class="flex items-center gap-3 group">
            <div class="relative">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 via-purple-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-brand-500/20 group-hover:shadow-brand-500/40 transition-shadow duration-300">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
              </div>
              <div class="absolute -inset-1 rounded-xl bg-gradient-to-br from-brand-500 via-purple-500 to-cyan-400 opacity-0 group-hover:opacity-20 blur-md transition-opacity duration-300"></div>
            </div>
            <div class="flex flex-col">
              <span class="text-lg font-bold text-gray-800 dark:text-gray-100 group-hover:text-brand-600 dark:group-hover:text-neon-cyan transition-colors duration-300">Resume AI</span>
              <span class="text-[10px] font-medium text-gray-400 dark:text-gray-500 -mt-0.5 tracking-wider uppercase">Intelligence Platform</span>
            </div>
          </a>
          <div class="flex items-center gap-2">
            {% block nav_extra %}{% endblock %}
            <!-- Theme Toggle -->
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
              <svg class="sun-icon w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
              </svg>
              <svg class="moon-icon w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="flex-1">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-200/60 dark:border-gray-800/40 bg-white/50 dark:bg-surface-950/50 backdrop-blur-sm mt-auto transition-colors duration-500">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
          <div class="flex items-center gap-2">
            <div class="w-5 h-5 rounded-md bg-gradient-to-br from-brand-500 to-purple-500 flex items-center justify-center">
              <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
            </div>
            <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Resume AI Platform</span>
          </div>
          <p class="text-xs text-gray-400 dark:text-gray-500">Powered by AI &middot; Built for results</p>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Theme toggle — uses event delegation to survive hx-boost swaps
    (function() {
      const html = document.documentElement;

      function setTheme(dark) {
        if (dark) {
          html.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          html.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }

      // Attach once on body — survives DOM swaps
      document.body.addEventListener('click', function(e) {
        var btn = e.target.closest('#theme-toggle');
        if (btn) {
          setTheme(!html.classList.contains('dark'));
        }
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
