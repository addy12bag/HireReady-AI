<div class="flex items-center gap-3 p-4 bg-green-50 dark:bg-green-950/50 border border-green-200 dark:border-green-800 rounded-xl fade-in">
  <svg class="w-5 h-5 text-green-600 dark:text-green-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-medium text-green-800 dark:text-green-300">{{ filename }} uploaded</p>
    <p class="text-xs text-green-600 dark:text-green-400 mt-0.5">{{ blocks }} blocks extracted &bull; {{ confidence }}% confidence</p>
  </div>
  <a href="/session/{{ session_id }}/results" class="text-xs text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 font-medium flex-shrink-0">
    Continue &rarr;
  </a>
</div>

<script>
  // Smooth HTMX refresh to update session state (no full browser reload)
  setTimeout(() => {
    htmx.ajax('GET', '/session/{{ session_id }}', {target: 'body', swap: 'innerHTML', pushUrl: true});
  }, 1200);
</script>
