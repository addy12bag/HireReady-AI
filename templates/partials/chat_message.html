<div class="flex gap-3 fade-in">
  {% if role == 'assistant' %}
  <div class="flex-shrink-0 w-8 h-8 rounded-full bg-brand-100 dark:bg-brand-900/50 flex items-center justify-center">
    <svg class="w-4 h-4 text-brand-600 dark:text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
  </div>
  {% endif %}
  <div class="px-4 py-3 max-w-[85%] rounded-2xl text-sm
    {% if role == 'user' %}
      bg-brand-600 text-white rounded-tr-md ml-auto
    {% else %}
      bg-white dark:bg-surface-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 rounded-tl-md
    {% endif %}">
    <p class="whitespace-pre-wrap">{{ content }}</p>
  </div>
</div>
